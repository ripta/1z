<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1z Snake</title>
<style>
  body { font-family: ui-monospace, monospace; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
  #stage { display: flex; justify-content: center; margin-top: 1rem; background: #000; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  #status { color: #888; margin-top: 0.5rem; }
  #status.error { color: #f88; }
</style>
</head>
<body>
<h1>1z Snake</h1>
<p>Snake, written in 1z on the browser game platform. Steer with the arrow keys or WASD;
eat the red food to grow and speed up. Walls and your own body are fatal.</p>
<div id="stage">
  <canvas id="canvas" width="256" height="224"></canvas>
</div>
<p id="status">loading...</p>
<script type="module" src="snake.js"></script>
</body>
</html>
