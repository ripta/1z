<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1z WebAssembly REPL</title>
<style>
  body { font-family: ui-monospace, monospace; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
  #output { background: #111; color: #ddd; padding: 1rem; height: 24rem; overflow-y: auto; white-space: pre-wrap; }
  #output .error { color: #f88; }
  #output .stack { color: #888; }
  .input-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  #prompt { font-weight: bold; }
  #input { flex: 1; font-family: inherit; font-size: 1rem; }
</style>
</head>
<body>
<h1>1z WebAssembly REPL</h1>
<p>The 1z interpreter, compiled to <code>wasm32-freestanding</code> and running entirely in this page.</p>
<div id="output"></div>
<div class="input-row">
  <span id="prompt">&gt;</span>
  <input id="input" type="text" autocomplete="off" autofocus>
</div>
<script type="module" src="repl.js"></script>
</body>
</html>
